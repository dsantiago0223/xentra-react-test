format_version: '26'
project_type: react_native

default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

trigger_map:
- push_branch: main
  workflow: build
- pull_request_source_branch: '*'
  pull_request_target_branch: main
  workflow: build
- push_branch: QA
  workflow: qa
- pull_request_source_branch: '*'
  pull_request_target_branch: QA
  workflow: qa

workflows:

  # =========================
  # 🧪 MAIN BUILD WORKFLOW
  # =========================
  build:
    steps:

    - activate-ssh-key@4: {}

    - git-clone@6: {}

    - cache-pull@2: {}

    # Install dependencies (clean + fast)
    - npm@1:
        inputs:
        - command: ci

    # Run tests
    - npm@1:
        inputs:
        - command: run
        - npm_args: test

    # =========================
    # 🤖 ANDROID BUILD (FIXED)
    # =========================
    - gradle-runner@2:
        inputs:
        - gradle_task: assembleRelease
        - project_location: android

    # Copy APK to deploy folder
    - script@1:
        title: Copy Android APK
        inputs:
        - content: |-
            #!/bin/bash
            set -e

            APK_DIR="android/app/build/outputs/apk/release"

            echo "APK dir: $APK_DIR"

            APK_PATH=$(find "$APK_DIR" -name "*.apk" | head -n 1)

            if [ -z "$APK_PATH" ]; then
              echo "❌ APK not found"
              exit 1
            fi

            echo "✅ Found APK: $APK_PATH"

            cp "$APK_PATH" "$BITRISE_DEPLOY_DIR/"
    
    # =========================
    # 🍎 IOS BUILD (CLEAN)
    # =========================
    - xcode-build-for-test@3:
        inputs:
        - scheme: XentraReactTest
        - project_path: ios/XentraReactTest.xcworkspace
        - destination: generic/platform=iOS

    # =========================
    # 📦 CACHE (MODERN)
    # =========================
    - cache-push@2: {}

    # =========================
    # 🚀 DEPLOY ARTIFACTS
    # =========================
    - deploy-to-bitrise-io@2: {}

  # =========================
  # 🧪 QA WORKFLOW
  # =========================
  qa:
    steps:

    - activate-ssh-key@4: {}

    - git-clone@6: {}

    - cache-pull@2: {}

    - npm@1:
        inputs:
        - command: ci

    - npm@1:
        inputs:
        - command: run
        - npm_args: test

    - gradle-runner@2:
        inputs:
        - gradle_task: assembleRelease
        - project_location: android

    - script@1:
        title: Copy Android APK
        inputs:
        - content: |-
            #!/bin/bash
            set -e

            APK_DIR="android/app/build/outputs/apk/release"
            APK_PATH=$(find "$APK_DIR" -name "*.apk" | head -n 1)

            if [ -z "$APK_PATH" ]; then
              echo "❌ APK not found"
              exit 1
            fi

            cp "$APK_PATH" "$BITRISE_DEPLOY_DIR/"

    - xcode-build-for-test@3:
        inputs:
        - scheme: XentraReactTest
        - project_path: ios/XentraReactTest.xcworkspace
        - destination: generic/platform=iOS

    - cache-push@2: {}

    - deploy-to-bitrise-io@2: {}

  # =========================
  # 🤖 ANDROID ONLY
  # =========================
  android:
    steps:

    - git-clone@6: {}

    - cache-pull@2: {}

    - npm@1:
        inputs:
        - command: ci

    - gradle-runner@2:
        inputs:
        - gradle_task: assembleRelease
        - project_location: android

    - cache-push@2: {}

    - deploy-to-bitrise-io@2: {}

  # =========================
  # 🍎 IOS ONLY
  # =========================
  ios:
    steps:

    - git-clone@6: {}

    - cache-pull@2: {}

    - npm@1:
        inputs:
        - command: ci

    - xcode-build-for-test@3:
        inputs:
        - scheme: XentraReactTest
        - project_path: ios/XentraReactTest.xcworkspace

    - xcode-build@3:
        inputs:
        - scheme: XentraReactTest
        - project_path: ios/XentraReactTest.xcworkspace
        - configuration: Release

    - cache-push@2: {}

    - deploy-to-bitrise-io@2: {}