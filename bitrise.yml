meta:
  bitrise.io:
    stack: osx-xcode-26.5.x
    machine_type_id: g2.mac.large
app:
  envs:
    - WORKDIR: '.'
      opts:
        is_expand: false
    - PROJECT_LOCATION: android
      opts:
        is_expand: false
    - MODULE: app
      opts:
        is_expand: false
    - VARIANT: Release
      opts:
        is_expand: false
    - ANDROID_VERSION_CODE: ''
      opts:
        is_expand: false
    - ANDROID_VERSION_NAME: ''
      opts:
        is_expand: false
    - IOS_MARKETING_VERSION: ''
      opts:
        is_expand: false
    - IOS_BUILD_NUMBER: ''
      opts:
        is_expand: false
    - BITRISE_PROJECT_PATH: ios/XentraReactTest.xcworkspace
      opts:
        is_expand: false
    - BITRISE_SCHEME: XentraReactTest
      opts:
        is_expand: false
    - BITRISE_DISTRIBUTION_METHOD: development
      opts:
        is_expand: false
