format_version: '11'
project_type: react_native

default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

trigger_map:
  - push_branch: main
    workflow: build
  - pull_request_target_branch: main
    workflow: build
  - push_branch: QA
    workflow: qa
  - pull_request_target_branch: QA
    workflow: qa

workflows:
  # =========================
  # MAIN BUILD (APK OUTPUT)
  # =========================
  build:
    steps:
      - git-clone@6: {}

      - cache-pull@2.4:
          inputs:
          - cache_paths: |
              node_modules -> package.json,yarn.lock
              android/.gradle -> android/build.gradle,android/app/build.gradle

      # Install dependencies (fast + consistent)
      - npm@1:
          inputs:
            - command: ci

      # Run tests
      - npm@1:
          inputs:
            - command: run
            - npm_args: test

      # =========================
      #  ANDROID APK BUILD
      # =========================
      - gradle-runner@2:
          inputs:
            - project_location: android
            - gradle_task: assembleRelease

      # =========================
      # FIND + COPY APK
      # =========================
      - script@1:
          title: Collect APK artifact
          inputs:
            - content: |-
                #!/bin/bash
                set -e

                echo "Searching for APK..."

                APK_PATH=$(find android/app/build/outputs/apk/release \
                  -name "*.apk" | head -n 1)

                if [ -z "$APK_PATH" ]; then
                  echo "APK not found!"
                  exit 1
                fi

                echo "APK found: $APK_PATH"

                mkdir -p "$BITRISE_DEPLOY_DIR"
                cp "$APK_PATH" "$BITRISE_DEPLOY_DIR/app-release.apk"

      # =========================
      # IOS TEST BUILD (optional)
      # =========================
      - xcode-build-for-test@3:
          inputs:
            - scheme: XentraReactTest
            - project_path: ios/XentraReactTest.xcworkspace
            - destination: generic/platform=iOS

      - cache-push@2.4:
          inputs:
          - cache_paths: |
              node_modules -> package.json,yarn.lock
              android/.gradle -> android/build.gradle,android/app/build.gradle

      - deploy-to-bitrise-io@2: {}

  # =========================
  # 🧪 QA BUILD (same but isolated)
  # =========================
  qa:
    steps:
      - git-clone@6: {}

      - cache-pull@2.4:
          inputs:
          - cache_paths: |
              node_modules -> package.json,yarn.lock
              android/.gradle -> android/build.gradle,android/app/build.gradle

      - npm@1:
          inputs:
            - command: ci

      - npm@1:
          inputs:
            - command: run
            - npm_args: test

      - gradle-runner@2:
          inputs:
            - project_location: android
            - gradle_task: assembleRelease

      - script@1:
          title: Collect APK artifact
          inputs:
            - content: |-
                #!/bin/bash
                set -e

                APK_PATH=$(find android/app/build/outputs/apk/release \
                  -name "*.apk" | head -n 1)

                mkdir -p "$BITRISE_DEPLOY_DIR"
                cp "$APK_PATH" "$BITRISE_DEPLOY_DIR/app-release.apk"

      - xcode-build-for-test@3:
          inputs:
            - scheme: XentraReactTest
            - project_path: ios/XentraReactTest.xcworkspace

      - cache-push@2.4:
          inputs:
          - cache_paths: |
              node_modules -> package.json,yarn.lock
              android/.gradle -> android/build.gradle,android/app/build.gradle

      - deploy-to-bitrise-io@2: {}