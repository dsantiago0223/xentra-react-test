---
format_version: '26'
project_type: react_native
trigger_map:
- push_branch: main
  workflow: build-and-test
- pull_request_source_branch: '*'
  pull_request_target_branch: main
  workflow: build-and-test
- push_branch: QA
  workflow: qa-build
- pull_request_source_branch: '*'
  pull_request_target_branch: QA
  workflow: qa-build
workflows:
  build-and-test:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@6: {}
    - cache-pull@2: {}
    - npm@1:
        inputs:
        - command: install
    - npm@1:
        inputs:
        - command: ci
    - npm@1:
        inputs:
        - command: run
        - npm_args: test
    - build-android-app@1:
        inputs:
        - project_location: android
        - module: app
        - variant: release
    - script@1:
        title: Copy Android release APK to deploy dir
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            apk_dir="android/app/build/outputs/apk/release"
            echo "BITRISE_DEPLOY_DIR=$BITRISE_DEPLOY_DIR"
            echo "APK output dir: $apk_dir"
            mkdir -p "$BITRISE_DEPLOY_DIR"
            ls -la "$apk_dir" || true
            apk_path=$(find "$apk_dir" -maxdepth 1 -type f \( -name '*release*.apk' -o -name '*unsigned.apk' \) | head -n 1)
            if [[ -z "$apk_path" ]]; then
              echo "Release APK not found"
              exit 1
            fi
            echo "Copying APK: $apk_path"
            cp "$apk_path" "$BITRISE_DEPLOY_DIR/"
    - xcode-build-for-test@2:
        inputs:
        - scheme: XentraReactTest
        - project_path: ios/XentraReactTest.xcworkspace
        - destination: generic/platform=iOS
    - cache-push@2: {}
    - deploy-to-bitrise-io@2: {}
  qa-build:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@6: {}
    - cache-pull@2: {}
    - npm@1:
        inputs:
        - command: install
    - npm@1:
        inputs:
        - command: ci
    - npm@1:
        inputs:
        - command: run
        - npm_args: test
    - build-android-app@1:
        inputs:
        - project_location: android
        - module: app
        - variant: release
    - script@1:
        title: Copy Android release APK to deploy dir
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            apk_dir="android/app/build/outputs/apk/release"
            echo "BITRISE_DEPLOY_DIR=$BITRISE_DEPLOY_DIR"
            echo "APK output dir: $apk_dir"
            mkdir -p "$BITRISE_DEPLOY_DIR"
            ls -la "$apk_dir" || true
            apk_path=$(find "$apk_dir" -maxdepth 1 -type f \( -name '*release*.apk' -o -name '*unsigned.apk' \) | head -n 1)
            if [[ -z "$apk_path" ]]; then
              echo "Release APK not found"
              exit 1
            fi
            echo "Copying APK: $apk_path"
            cp "$apk_path" "$BITRISE_DEPLOY_DIR/"
    - xcode-build-for-test@2:
        inputs:
        - scheme: XentraReactTest
        - project_path: ios/XentraReactTest.xcworkspace
        - destination: generic/platform=iOS
    - cache-push@2: {}
    - deploy-to-bitrise-io@2: {}
  build-android:
    steps:
    - git-clone@6: {}
    - cache-pull@2: {}
    - npm@1:
        inputs:
        - command: install
    - build-android-app@1:
        inputs:
        - project_location: android
        - module: app
        - variant: release
    - cache-push@2: {}
    - deploy-to-bitrise-io@2: {}
  build-ios:
    steps:
    - git-clone@6: {}
    - cache-pull@2: {}
    - npm@1:
        inputs:
        - command: install
    - xcode-build-for-test@2:
        inputs:
        - scheme: XentraReactTest
        - project_path: ios/XentraReactTest.xcworkspace
    - xcode-build@2:
        inputs:
        - scheme: XentraReactTest
        - project_path: ios/XentraReactTest.xcworkspace
        - configuration: Release
    - cache-push@2: {}