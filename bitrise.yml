---
format_version: '26'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native
workflows:
  android-build:
    description: |
      Tests, builds and deploys the app using *Deploy to bitrise.io* Step.

      Next steps:
      - Set up an [Apple service with API key](https://docs.bitrise.io/en/bitrise-platform/integrations/apple-services-connection/connecting-to-an-apple-service-with-api-key.html).
      - Check out [Getting started with React Native apps](https://docs.bitrise.io/en/bitrise-ci/getting-started/quick-start-guides/getting-started-with-react-native-projects.html).
    steps:
      - git-clone@8: {}
      - script@1:
          title: Generate .env from Bitrise env vars
          inputs:
            - content: |
                #!/bin/bash
                set -e
                cat > .env <<EOF
                API_BASE_URL=${API_BASE_URL}
                API_VERSION=${API_VERSION}
                API_KEY=${API_KEY}
                LOG_API_RESPONSE=${LOG_API_RESPONSE}
                EOF

                echo ".env generated:"
                cat .env
      - npm@3:
          title: npm install
          inputs:
            - workdir: '$WORKDIR'
            - command: install
      - npm@3:
          title: npm test
          inputs:
            - workdir: '$WORKDIR'
            - command: test
      - script@1:
          title: Bump Android versionCode/versionName
          inputs:
            - content: |
                #!/bin/bash
                set -e

                BUILD_GRADLE="android/app/build.gradle"
                if [ ! -f "$BUILD_GRADLE" ]; then
                  echo "Error: $BUILD_GRADLE not found"
                  exit 1
                fi

                if [ -n "$ANDROID_VERSION_CODE" ]; then
                  perl -pi -e "s/^(\s*versionCode\s+)\d+/\$1$ANDROID_VERSION_CODE/" "$BUILD_GRADLE"
                  echo "Set Android versionCode to: $ANDROID_VERSION_CODE"
                else
                  CURRENT_CODE=$(grep -E '^[[:space:]]*versionCode [0-9]+' "$BUILD_GRADLE" | head -n 1 | awk '{print $2}')
                  NEXT_CODE=$((CURRENT_CODE + 1))
                  perl -pi -e "s/^(\s*versionCode\s+)\d+/\$1$NEXT_CODE/" "$BUILD_GRADLE"
                  echo "Auto-incremented Android versionCode: $CURRENT_CODE -> $NEXT_CODE"
                fi

                if [ -n "$ANDROID_VERSION_NAME" ]; then
                  perl -pi -e "s/^(\s*versionName\s+)\"[^\"]+\"/\$1\"$ANDROID_VERSION_NAME\"/" "$BUILD_GRADLE"
                  echo "Set Android versionName to: $ANDROID_VERSION_NAME"
                fi
      - install-missing-android-tools@3:
          inputs:
            - gradlew_path: '$PROJECT_LOCATION/gradlew'
      - script@1:
          title: Download and setup release keystore
          inputs:
            - content: |
                #!/bin/bash
                set -ex

                # Create keystores directory if it doesn't exist
                mkdir -p $HOME/keystores

                # Download keystore from Bitrise
                if [ -n "$BITRISEIO_ANDROID_KEYSTORE_URL" ]; then
                  KEYSTORE_PATH="$HOME/keystores/release.keystore"
                  curl -fLo "$KEYSTORE_PATH" "$BITRISEIO_ANDROID_KEYSTORE_URL"
                  
                  # Export the path for the build step to use
                  envman add --key BITRISEIO_ANDROID_KEYSTORE_PATH --value "$KEYSTORE_PATH"
                  echo "Keystore downloaded to: $KEYSTORE_PATH"
                else
                  echo "Warning: BITRISEIO_ANDROID_KEYSTORE_URL not set"
                fi
      - script@1:
          title: Debug keystore files
          inputs:
            - content: |
                #!/bin/bash
                set -ex

                echo "HOME=$HOME"

                echo "Listing keystores directory..."
                ls -la $HOME/keystores || true

                echo "BITRISEIO_ANDROID_KEYSTORE_URL=$BITRISEIO_ANDROID_KEYSTORE_URL"
                echo "BITRISEIO_ANDROID_KEYSTORE_ALIAS=$BITRISEIO_ANDROID_KEYSTORE_ALIAS"
                echo "BITRISEIO_ANDROID_KEYSTORE_PATH=$BITRISEIO_ANDROID_KEYSTORE_PATH"
      - android-build@1:
          title: Build Release APK
          inputs:
            - project_location: '$PROJECT_LOCATION'
            - module: '$MODULE'
            - variant: '$VARIANT'
            - build_type: apk
      - android-build@1:
          title: Build Release AAB
          inputs:
            - project_location: '$PROJECT_LOCATION'
            - module: '$MODULE'
            - variant: '$VARIANT'
            - build_type: aab
      - slack@4:
          inputs:
            - webhook_url: '$SLACK_WEBHOOK_URL'
            - channel: '$SLACK_CHANNEL'
            - message: Build <$BITRISE_BUILD_URL|#$BITRISE_BUILD_NUMBER> for
                $BITRISE_APP_TITLE finished on branch $BITRISE_GIT_BRANCH.
            - send_only_on_failure: 'no'
      - deploy-to-bitrise-io@2: {}
    triggers:
      push:
        - branch: main
        - branch: QA
      pull_request:
        - source_branch: '*'
          target_branch: main
        - source_branch: '*'
          target_branch: QA
    envs:
      - API_VERSION: v1
        opts:
          is_expand: false
      - LOG_API_RESPONSE: false
        opts:
          is_expand: false
  primary:
    description: |
      Runs tests.

      Next steps:
      - Check out [Getting started with React Native apps](https://docs.bitrise.io/en/bitrise-ci/getting-started/quick-start-guides/getting-started-with-react-native-projects.html).
    steps:
      - git-clone@8: {}
      - restore-npm-cache@3: {}
      - npm@3:
          title: npm install
          inputs:
            - workdir: '$WORKDIR'
            - command: install
      - npm@3:
          title: npm test
          inputs:
            - workdir: '$WORKDIR'
            - command: test
      - save-npm-cache@1: {}
      - deploy-to-bitrise-io@2: {}

