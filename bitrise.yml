---
format_version: '11'
default_step_retry_count: 1
project_type: react_native
trigger_map:
- push_branch: main
  workflow: build-and-test
- pull_request_source_branch: '*'
  workflow: build-and-test
workflows:
  build-and-test:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@6: {}
    - cache-pull@2: {}
    - npm@1:
        inputs:
        - command: install
    - npm@1:
        inputs:
        - command: ci
    - npm@1:
        inputs:
        - command: run
        - npm_args: test
    - build-android-app@1:
        inputs:
        - project_location: android
        - module: app
        - variant: release
    - xcode-build-for-test@2:
        inputs:
        - scheme: XentraReactTest
        - project_path: ios/XentraReactTest.xcworkspace
        - destination: generic/platform=iOS
    - cache-push@2: {}
    - deploy-to-bitrise-io@2: {}
  build-android:
    steps:
    - git-clone@6: {}
    - cache-pull@2: {}
    - npm@1:
        inputs:
        - command: install
    - build-android-app@1:
        inputs:
        - project_location: android
        - module: app
        - variant: release
    - cache-push@2: {}
    - deploy-to-bitrise-io@2: {}
  build-ios:
    steps:
    - git-clone@6: {}
    - cache-pull@2: {}
    - npm@1:
        inputs:
        - command: install
    - xcode-build-for-test@2:
        inputs:
        - scheme: XentraReactTest
        - project_path: ios/XentraReactTest.xcworkspace
    - xcode-build@2:
        inputs:
        - scheme: XentraReactTest
        - project_path: ios/XentraReactTest.xcworkspace
        - configuration: Release
    - cache-push@2: {}